name: Draft release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: draft-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  draft:
    name: Prepare draft with verified bundle
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tester-bundle
          path: release-assets
      - name: Verify assets and prepare draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -Raw -Encoding UTF8 manifest.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -cne "v$version") { throw 'Tag/version mismatch' }
          $notes = "docs/releases/v$version.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw "Missing reviewed release notes: $notes" }
          $zip = "release-assets/max-archive-$version-test.zip"
          $checksum = "$zip.sha256"
          $pdf = 'release-assets/pdf/max-archive-quick-start.pdf'
          foreach ($file in @($zip, $checksum, $pdf)) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing asset: $file" }
          }
          $expected = ((Get-Content -Raw $checksum).Trim() -split '\s+')[0]
          if ((Get-FileHash -Algorithm SHA256 $zip).Hash -ine $expected) { throw 'ZIP SHA256 mismatch' }
          # create refuses an existing release; never overwrite a published release or a reviewed draft.
          gh release create $env:RELEASE_TAG $zip $checksum $pdf --verify-tag --draft --prerelease --title "MAX Архив $version — тестовая версия" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed; inspect the existing release before retrying' }
          'Draft prepared. Review the PDF, extension behavior and release notes before publication.' >> $env:GITHUB_STEP_SUMMARY
