name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Tests and JavaScript checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check versions, release tag and JavaScript syntax
        run: npm run check
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - run: npm test

  package:
    name: Windows tester bundle
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install packaging dependencies
        run: python -m pip install -r scripts/requirements-release.txt
      - name: Build and validate ZIP and PDF
        run: python scripts/package-test-release.py
      - name: Save bundle for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tester-bundle
          if-no-files-found: error
          retention-days: 14
          path: |
            output/max-archive-*-test.zip
            output/max-archive-*-test.zip.sha256
            output/pdf/max-archive-quick-start.pdf
