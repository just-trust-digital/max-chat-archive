<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAX Архив — варианты настроек</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8eaf0;color:#182237;font:14px system-ui,sans-serif}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 24px;background:#fff;border-bottom:1px solid #d5dae3}header strong{margin-right:auto}button,select{font:inherit;padding:9px 14px;border:1px solid #d2d8e4;border-radius:8px;background:white;color:inherit;min-height:42px}button[aria-pressed=true]{background:#202c46;color:white;border-color:#202c46}.intro{max-width:1180px;margin:20px auto;padding:0 20px;line-height:1.5}.intro h1{font-size:23px;margin:0 0 6px}.intro p{margin:5px 0;color:#536178}.workspace{overflow:auto;padding:0 16px 28px;text-align:center}iframe{border:1px solid #ccd2df;display:block;margin:auto;border-radius:12px;background:white;max-width:none}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button:focus-visible,select:focus-visible{outline:3px solid #6656e8;outline-offset:2px}@media(max-width:600px){header{padding:12px}.workspace{padding:0 0 16px}.intro{padding:0 12px}}
</style></head><body><header><strong>MAX Архив · варианты дизайна</strong><div class="controls"><button data-variant="a" aria-pressed="true">A · Спокойный</button><button data-variant="b" aria-pressed="false">B · Структурный</button><button id="theme" aria-pressed="false">Тёмная тема</button><label>Ширина <select id="width"><option>1280</option><option>768</option><option>390</option></select></label></div></header><div class="intro"><h1 id="title">A · Спокойный</h1><p id="description">Компактные строки настроек, мягкие границы и отдельный список чатов. Скруглённая стрелка экспорта.</p><p>Два предложения для сравнения. Чаты и ход экспорта демонстрационные; файлы не скачиваются.</p></div><div class="workspace"><iframe id="preview" title="Экран настроек" width="1280" height="1120" src="screen.html?variant=a&amp;theme=light"></iframe></div><script>
let variant='a',theme='light';const frame=document.getElementById('preview');const variants={a:['A · Спокойный','Компактные строки настроек, мягкие границы и отдельный список чатов. Скруглённая стрелка экспорта.'],b:['B · Структурный','Крупная типографика, прямые рамки и три пронумерованных блока. Угловатая стрелка экспорта.']};function update(){frame.src=`screen.html?variant=${variant}&theme=${theme}`;frame.width=document.getElementById('width').value;frame.height=Number(frame.width)<700?'2260':'1120';document.getElementById('title').textContent=variants[variant][0];document.getElementById('description').textContent=variants[variant][1];document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.variant===variant)));document.getElementById('theme').setAttribute('aria-pressed',String(theme==='dark'))}document.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>{variant=b.dataset.variant;update()});document.getElementById('theme').onclick=()=>{theme=theme==='light'?'dark':'light';update()};document.getElementById('width').onchange=update;window.addEventListener('message',event=>{if(event.source===frame.contentWindow && event.data?.type==='max-design-size' && Number.isFinite(event.data.height))frame.height=Math.max(600,Math.min(6000,event.data.height));});
</script></body></html>
