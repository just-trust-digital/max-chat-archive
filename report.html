<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Связаться с нами — MAX Архив</title><link rel="icon" href="assets/icon-32.png"><link rel="stylesheet" href="styles.css"></head>
<body class="app"><main class="shell report-shell">
  <header class="topbar"><div class="brand"><img src="assets/export.svg" width="40" height="40" alt=""><span>MAX Архив<small>Экспорт переписки</small></span></div><a href="export.html" class="report-back">К экспорту</a></header>
  <section class="hero"><h1>Связаться с нами</h1></section>
  <form id="report-form" class="card report-card">
    <p class="report-known"><a href="known-issues.html">Известные проблемы</a></p><label class="field">Тема · необязательно<select id="report-kind"><option value="">Не выбрана</option><option value="problem">Проблема</option><option value="idea">Предложение</option></select></label>
    <label class="field">Что произошло или что вы предлагаете<textarea id="report-text" rows="6" maxlength="1500" required placeholder="Расскажите своими словами"></textarea></label>
    <label class="field">Контакт для ответа, если нужен<input id="report-contact" type="text" maxlength="120" autocomplete="off" placeholder="Необязательно"></label>
    <p class="hint">Не добавляйте переписку, имена контактов, ссылки на чаты, пароли и файлы экспорта.</p>
    <details class="report-preview"><summary>Данные обращения</summary><pre id="report-payload"></pre></details>
    <label class="report-consent"><input id="report-consent" type="checkbox"><span>Я проверил(а) отчёт и согласен(на) отправить его.</span></label>
    <div class="report-actions"><button id="report-send" class="primary" type="submit">Отправить</button><button id="report-cancel" class="secondary" type="button">Отмена</button></div>
    <div id="report-status" role="status"></div>
  </form>
