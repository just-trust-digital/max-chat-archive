<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Связаться с нами — MAX Архив</title><link rel="icon" href="assets/icon-32.png"><link rel="stylesheet" href="styles.css"></head>
<body class="app"><main class="shell report-shell">
  <header class="topbar"><div class="brand"><img src="assets/export.svg" width="40" height="40" alt=""><span>MAX Архив<small>Экспорт переписки</small></span></div><a href="export.html" class="report-back">К экспорту</a></header>
  <section class="hero"><h1>Связаться с нами</h1><p>Опишите проблему или предложите улучшение.</p></section>
  <form id="report-form" class="card report-card">
    <label class="field">Тема<select id="report-kind"><option value="problem">Сообщить о проблеме</option><option value="idea">Предложить улучшение</option></select></label>
    <label class="field">Что произошло или что вы предлагаете<textarea id="report-text" rows="6" maxlength="1500" required placeholder="Расскажите своими словами"></textarea></label>
    <label class="field">Контакт для ответа, если нужен<input id="report-contact" type="text" maxlength="120" autocomplete="off" placeholder="Необязательно"></label>
    <p class="hint">Не добавляйте переписку, имена контактов, ссылки на чаты, пароли и файлы экспорта.</p>
    <section class="report-preview" aria-labelledby="preview-heading"><h2 id="preview-heading">Перед отправкой</h2><p>Проверьте текст и технические сведения ниже.</p><pre id="report-payload"></pre></section>
    <label class="report-consent"><input id="report-consent" type="checkbox"><span>Я проверил(а) отчёт и согласен(на) отправить его.</span></label>
    <div class="report-actions"><button id="report-send" class="primary" type="submit">Отправить</button><button id="report-save" class="secondary" type="button">Сохранить в браузере</button><button id="report-delete" class="text-button" type="button" hidden>Удалить черновик</button></div>
    <div id="report-status" role="status"></div>
  </form>
  <footer class="product-footer"><a class="maker" href="https://justtrust.digital" target="_blank" rel="noopener noreferrer"><img class="jtd-light" src="assets/jtd-light.svg" alt="JTD" width="38" height="32"><img class="jtd-dark" src="assets/jtd-dark.svg" alt="JTD" width="38" height="32"></a><a class="github-link" href="known-issues.html">Известные проблемы</a></footer>
</main><script src="reporting.js"></script><script src="report.js"></script></body></html>
